; LightLink ESP8266 replacement controller
; Inova LightLink CFM16.200 (200 x 16, red/green/orange)

[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
; 4MB flash: 1MB sketch / ~3MB LittleFS for .fseq files
board_build.ldscript = eagle.flash.4m3m.ld
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit GFX Library@^1.11.9
    bblanchon/ArduinoJson@^7.0.4
; SHIFT_NOPS sets the panel shift-clock delay. Raise it (12, 20, ...) if the
; far panels in a band show random pixels.
build_flags =
    -DSHIFT_NOPS=6
    -DPIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

; Same firmware for a NodeMCU v2/v3 board
[env:nodemcuv2]
extends = env:d1_mini
board = nodemcuv2
